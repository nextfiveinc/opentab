<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Tab</title>
  <meta name="description" content="Free, working web apps and games, most of them built with AI.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved colour mode before first paint (no light flash in dark mode).
    try {
      var m = localStorage.getItem('cat:theme') || 'system';
      if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = m;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./default-theme/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./theme.css">
