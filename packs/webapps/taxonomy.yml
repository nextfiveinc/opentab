      - { id: fitness-habits, label: Fitness and habits }
      - { id: sleep-mindfulness, label: Sleep and mindfulness }
      - { id: food-nutrition, label: Food and nutrition }
  money:
    label: Money and business
    keywords: [budget, invoice, quote, expense, salary, mortgage, planning calculator, marketing]
    subcategories:
      - { id: budgeting, label: Budgeting }
      - { id: quotes-invoices, label: Quotes and invoices }
      - { id: planning-calculators, label: Planning calculators }
      - { id: marketing-tools, label: Marketing tools }
  life-home:
    label: Life and home
    keywords: [travel, recipe, cooking, family, community, local, shopping list, garden]
    subcategories:
      - { id: travel-maps, label: Travel and maps }
      - { id: cooking, label: Cooking }
      - { id: family, label: Family }
      - { id: local-community, label: Local and community }
  accessibility:
